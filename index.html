<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Drive</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f3f4;
        }

        /* Header */
        header {
            background-color: #ffffff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            color: #202124;
        }

        .search-box input {
            padding: 8px 12px;
            width: 250px;
            border-radius: 20px;
            border: 1px solid #ccc;
        }

        /* Main Container */
        .container {
            padding: 20px;
        }

        /* File Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
        }

        th {
            background-color: #e8eaed;
        }

        tr {
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .file-icon {
            margin-right: 8px;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h1>My Drive</h1>
    <div class="search-box">
        <input type="text" placeholder="Search in Drive">
    </div>
</header>

<div class="container">
    <div id="startSection">
    <input type="text" id="nickname" placeholder="Enter your nickname">
    <br><br>
    <button onclick="startQuiz()">Start Quiz</button>
</div>

<div id="quizSection" style="display:none;">
    <h3 id="nicknameDisplay"></h3>
</div>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Owner</th>
                <th>Last Modified</th>
                <th>File Size</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>📄 Report.docx</td>
                <td>You</td>
                <td>Feb 18, 2026</td>
                <td>120 KB</td>
            </tr>
            <tr>
                <td>📊 Sales.xlsx</td>
                <td>You</td>
                <td>Feb 15, 2026</td>
                <td>540 KB</td>
            </tr>
            <tr>
                <td>📁 Project Folder</td>
                <td>You</td>
                <td>Feb 10, 2026</td>
                <td>—</td>
            </tr>
            <tr>
                <td>📷 Image.png</td>
                <td>You</td>
                <td>Feb 05, 2026</td>
                <td>2.1 MB</td>
            </tr>
        </tbody>
    </table>
</div>

<footer>
    © 2026 My Drive
</footer>
<script>
async function startQuiz() {

const nickname = document.getElementById("nickname").value;

if(nickname === ""){
alert("Please enter a nickname");
return;


try {

const response = await fetch("https://THAICONSONANT-service.onrender.com/api/quiz/start", {
method: "POST",
headers: {
"Content-Type": "application/json"
},
body: JSON.stringify({ nickname: nickname })
});

const data = await response.json();

document.getElementById("startSection").style.display = "none";
document.getElementById("quizSection").style.display = "block";

document.getElementById("nicknameDisplay").innerText =
nickname + " - Starts: " + data.counter;

} catch (error) {
alert("Backend not working yet");
}

}
</script>
</body>
</html>
