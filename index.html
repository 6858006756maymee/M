<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Thai Consonant Drill</title>
<style>
body{
    font-family: Arial;
    text-align:center;
    background:#f2f2f2;
}
#letter{
    font-size:120px;
    margin:40px;
}
button{
    padding:15px;
    margin:10px;
    font-size:18px;
    width:200px;
}
#result{
    font-size:24px;
    margin:20px;
}
</style>
</head>

<body>

<h1>Thai Consonant Drill</h1>
<div id="letter"></div>

<div id="choices"></div>

<div id="result"></div>

<script>

const consonants = [
{letter:"ก",name:"ko kai"},
{letter:"ข",name:"kho khai"},
{letter:"ค",name:"kho khwai"},
{letter:"ง",name:"ngo ngu"},
{letter:"จ",name:"cho chan"},
{letter:"ช",name:"cho chang"},
{letter:"ซ",name:"so so"},
{letter:"ญ",name:"yo ying"},
{letter:"ด",name:"do dek"},
{letter:"ต",name:"to tao"},
{letter:"ถ",name:"tho thung"},
{letter:"ท",name:"tho thahan"},
{letter:"น",name:"no nu"},
{letter:"บ",name:"bo baimai"},
{letter:"ป",name:"po pla"},
{letter:"ผ",name:"pho phueng"},
{letter:"พ",name:"pho phan"},
{letter:"ฟ",name:"fo fan"},
{letter:"ม",name:"mo ma"},
{letter:"ย",name:"yo yak"},
{letter:"ร",name:"ro rua"},
{letter:"ล",name:"lo ling"},
{letter:"ว",name:"wo waen"},
{letter:"ส",name:"so sua"},
{letter:"ห",name:"ho hip"},
{letter:"อ",name:"o ang"}
];

let current;

function newQuestion(){

document.getElementById("result").innerHTML="";

current = consonants[Math.floor(Math.random()*consonants.length)];

document.getElementById("letter").innerHTML = current.letter;

let answers = [current.name];

while(answers.length < 4){
    let rand = consonants[Math.floor(Math.random()*consonants.length)].name;
    if(!answers.includes(rand)){
        answers.push(rand);
    }
}

answers.sort(()=>Math.random()-0.5);

let html="";
answers.forEach(a=>{
    html += `<button onclick="checkAnswer('${a}')">${a}</button><br>`;
});

document.getElementById("choices").innerHTML = html;

}

function checkAnswer(answer){

if(answer === current.name){
    document.getElementById("result").innerHTML = "✅ Correct!";
}
else{
    document.getElementById("result").innerHTML = "❌ Wrong! Correct answer: " + current.name;
}

setTimeout(newQuestion,1500);

}

newQuestion();

</script>

</body>
</html>
